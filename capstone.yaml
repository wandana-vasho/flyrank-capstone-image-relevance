run: pip install -r requirements.txt && python -m uvicorn main:app --reload
seed: python corpus/download_corpus.py && python seed.py
test: TESTING=1 pytest -v
base_url: http://localhost:8000
endpoints:
  - POST /batch-jobs/tag-images
  - POST /batch-jobs/embed-images
  - POST /batch-jobs/embed-posts
  - GET /batch-jobs/{id}
  - GET /images
  - GET /posts/{id}/images
  - GET /suggestions
  - POST /suggestions/{id}/approve
  - POST /suggestions/{id}/reject
  - POST /eval/run
  - GET /costs/summary
  - GET /health
